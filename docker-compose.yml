# Services: db (PostgreSQL), migrate (one-shot Alembic upgrade), api, worker (jobs and backups).
# All configuration comes from environment variables - locally from .env (see .env.example),
# on Portainer from the stack environment.

x-app-environment: &app-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}

x-app: &app
  build: .
  image: seismo:local
  environment: *app-environment

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # The only persistent storage of the stack (architecture.md, "Deployment and Persistence").
      # PostgreSQL 18 images keep their data in a versioned directory below this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs once per start or deploy; api and worker start only after it succeeded, so several
  # api or worker replicas never race each other on a migration.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-environment
      # Admin login - only the api gets it, worker and migrate never see the password.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Only to warn on the source list when it is missing; the worker sends it.
      FETCH_CONTACT: ${FETCH_CONTACT:-}
      # Only shown in the Plattform-Einstellungen; the worker extracts with them.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
    restart: unless-stopped
    volumes:
      # The same backups as the worker's: the Plattform-Einstellungen list them, download them and take uploads.
      - ${BACKUP_HOST_DIR:-db-backups}:/backups
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    # On a stop the worker finishes its current job (app/worker/main.py); Docker's default of 10 s would kill an
    # LLM call and repeat it after the lease. Longer than one call (app/llm/ollama.py, ANSWER_TIMEOUT_SECONDS 300 s)
    # with its effect; a stopping worker asks the model no follow-up question. Only a running job makes it wait.
    stop_grace_period: 6m
    environment:
      <<: *app-environment
      # Sent in the User-Agent of every source fetch, so a source can reach the operator.
      FETCH_CONTACT: ${FETCH_CONTACT:-}
      # The appname ReliefWeb approved; without it a ReliefWeb Quelle fails (README.md).
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-}
      # The key of the EIA Open Data API; without it an EIA Quelle fails (README.md).
      EIA_API_KEY: ${EIA_API_KEY:-}
      # The LLM server in the LAN (architecture.md, "Environments and LLM"); empty: no event extraction.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
    restart: unless-stopped
    volumes:
      # Backups (README.md, "Backups"): the volume db-backups, or with BACKUP_HOST_DIR an absolute path
      # on the host - e.g. a mounted NAS share, so a backup survives the loss of this host's disk.
      - ${BACKUP_HOST_DIR:-db-backups}:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  db-backups:
