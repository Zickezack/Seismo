# Services: db (PostgreSQL), migrate (one-shot Alembic upgrade), api, worker.
# All configuration comes from environment variables - locally from .env (see .env.example),
# on Portainer from the stack environment.

x-app: &app
  build: .
  image: seismo:local
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # The only persistent storage of the stack (architecture.md, "Deployment and Persistence").
      # PostgreSQL 18 images keep their data in a versioned directory below this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs once per start or deploy; api and worker start only after it succeeded, so several
  # api or worker replicas never race each other on a migration.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
