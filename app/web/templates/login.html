{% extends "base.html" %}
{% block title %}Anmelden{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>Anmelden</h1>
  {% if error %}
  <p class="message message-error" role="alert" data-testid="login-error">{{ error }}</p>
  {% endif %}
  <form class="form-grid" method="post" action="/login" data-testid="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="username">Benutzername</label>
      <input id="username" name="username" autocomplete="username" required value="{{ username or '' }}"{% if not username %} autofocus{% endif %}>
    </div>
    <div class="field">
      <label for="password">Passwort</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required{% if username %} autofocus{% endif %}>
    </div>
    <div class="form-actions">
      <button class="button" type="submit" data-testid="login-submit">Anmelden</button>
    </div>
  </form>
</section>
{% endblock %}
