# The database URL is not configured here: migrations/env.py reads it from the
# environment variables (app/config.py), like every other part of the app.
[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
