# Development stack: the `dev` container next to the services of ../docker-compose.yml.
# Relative paths resolve from the first compose file, i.e. the repository root.

# A project of its own, with its own database volume: closing the dev container never stops a
# stack started with `docker compose up`, and that stack's `down` never trips over `dev`.
name: seismo-dev

# migrate, api and worker run the workspace code instead of the copy in the image, so a saved
# change shows up without a rebuild. Only a dependency change needs a new image (README.md).
x-live-code: &live-code
  build:
    context: .
    target: dev
  image: seismo:dev
  volumes:
    - ./app:/app/app
    - ./migrations:/app/migrations

# A failed migration must not keep the dev container from starting - that is where it gets fixed.
x-after-migrate: &after-migrate
  migrate:
    condition: service_completed_successfully
    required: false

x-watch-environment: &watch-environment
  # File events do not cross a bind mount from Windows; polling sees every change.
  WATCHFILES_FORCE_POLLING: "true"
  # The dev stack's own Ollama (service ollama below); live names the LAN server in .env instead.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}

services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.14
    command: sleep infinity
    working_dir: /workspaces/Seismo
    volumes:
      - .:/workspaces/Seismo:cached
      # Claude Code login, settings and history survive container rebuilds.
      - claude-config:/home/vscode/.claude
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      FETCH_CONTACT: ${FETCH_CONTACT:-}
      RELIEFWEB_APPNAME: ${RELIEFWEB_APPNAME:-}
      EIA_API_KEY: ${EIA_API_KEY:-}
      # For an api started from the terminal (skill verify).
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Makes Claude Code keep .claude.json (account, project trust) inside the volume as well.
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # For extraction checks from the terminal: the same Ollama as the worker's.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    depends_on:
      db:
        condition: service_healthy

  migrate:
    <<: *live-code

  api:
    <<: *live-code
    command: ["uvicorn", "app.web.main:app_from_env", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    environment: *watch-environment
    depends_on: *after-migrate

  worker:
    <<: *live-code
    command: ["watchfiles", "--filter", "python", "--target-type", "command", "python -m app.worker", "app"]
    environment: *watch-environment
    depends_on: *after-migrate

  # Development only (architecture.md, "Environments and LLM"): an Ollama on the host's NVIDIA GPU, started by
  # hand (README.md) and not in runServices - without GPU support in Docker it would keep the dev container from
  # starting. The production stack never contains one.
  ollama:
    image: ollama/ollama:0.40.4
    restart: unless-stopped
    volumes:
      # Pulled models survive a new container.
      - ollama-models:/root/.ollama
    environment:
      # One model in the GPU's memory at a time, the rest of it for the context.
      OLLAMA_MAX_LOADED_MODELS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  claude-config:
  ollama-models:
