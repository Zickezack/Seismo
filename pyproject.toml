[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "seismo"
version = "0.1.0"
description = "Self-hosted platform that turns global news into a versioned event and knowledge model."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1.6,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    # Starlette's TestClient prefers httpx2 and deprecates httpx.
    "httpx2>=2.16,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
