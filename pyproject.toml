[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "seismo"
version = "0.1.0"
description = "Self-hosted platform that turns global news into a versioned event and knowledge model."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1.6,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    # Templates for the dashboard (architecture.md, "Structure").
    "jinja2>=3.1.6,<4",
    # FastAPI needs it to parse HTML form posts (Form()).
    "python-multipart>=0.0.32,<0.1",
    # Signs the session cookie in Starlette's SessionMiddleware.
    "itsdangerous>=2.2,<3",
    # Reads RSS 0.9x, 1.0, 2.0 and Atom with their many date formats (app/sources/rss.py).
    "feedparser>=6.0.14,<7",
    # HTTP client of the source adapters (app/sources/http.py); Starlette's TestClient uses it as well.
    "httpx2>=2.15,<3",
    # The main text of an article page, without navigation, ads and comments (app/services/normalization_service.py).
    "trafilatura>=2.3,<3",
    # The language of an article's text, with a confidence, so an unsure guess stays unknown (datamodel.md, rule 5).
    "py3langid>=0.4,<0.5",
    # The text of a full text served as PDF.
    "pypdf>=6.21,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    # Drives the UI in a headless browser (skill verify); needs `playwright install chromium` once.
    "playwright>=1.64,<2",
]
# Dev stack image only (Dockerfile target `dev`): restarts api and worker when the code changes;
# uvicorn --reload uses it as well.
reload = [
    "watchfiles>=1.3,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
